export default function App() {
  const [searchQuery, setSearchQuery] = useState('');
  const [activeTab, setActiveTab] = useState('Todos');
  const [selectedProtocol, setSelectedProtocol] = useState(null);

  // Filtrado de protocolos basado en búsqueda y categoría activa
  const filteredProtocols = useMemo(() => {
    return protocolsData.filter(protocol => {
      const matchesSearch = 
        protocol.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
        protocol.indications.toLowerCase().includes(searchQuery.toLowerCase());
      
      const matchesCategory = activeTab === 'Todos' || protocol.category === activeTab;

      return matchesSearch && matchesCategory;
    });
  }, [searchQuery, activeTab]);

  // Icono dinámico según categoría
  const getCategoryIcon = (category) => {
    switch(category) {
      case 'Neuro': return <Brain size={18} />;
      case 'MSK': return <Bone size={18} />;
      case 'Cuerpo': return <Stethoscope size={18} />;
      default: return <Activity size={18} />;
    }
  };

  // Colores dinámicos para los badges de categoría
  const getCategoryColor = (category) => {
    switch(category) {
      case 'Neuro': return 'bg-blue-100 text-blue-800 border-blue-200';
      case 'MSK': return 'bg-orange-100 text-orange-800 border-orange-200';
      case 'Cuerpo': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
      default: return 'bg-gray-100 text-gray-800 border-gray-200';
    }
  };

  // --- VISTA DE DETALLE ---
  if (selectedProtocol) {
    return (
      <div className="min-h-screen bg-gray-50 flex flex-col font-sans">
        {/* Header Detalle */}
        <header className="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-10 flex items-center">
          <button 
            onClick={() => setSelectedProtocol(null)}
            className="mr-3 p-2 rounded-full hover:bg-blue-800 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-300 active:bg-blue-700"
          >
            <ChevronLeft size={24} />
          </button>
          <h1 className="text-xl font-bold truncate flex-1">{selectedProtocol.title}</h1>
        </header>

        {/* Contenido Detalle */}
        <main className="flex-1 p-4 overflow-y-auto pb-20">
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
            
            <div className="p-5 border-b border-gray-100 bg-gray-50 flex justify-between items-start">
              <div>
                <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border ${getCategoryColor(selectedProtocol.category)} mb-3`}>
                  {getCategoryIcon(selectedProtocol.category)}
                  {selectedProtocol.category}
                </span>
                <h2 className="text-2xl font-bold text-gray-800">{selectedProtocol.title}</h2>
              </div>
            </div>

            <div className="p-5 space-y-6">
              {/* Indicaciones */}
              <div>
                <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                  <Activity size={16} /> Diagnóstico / Indicaciones
                </h3>
                <p className="text-gray-700 leading-relaxed bg-blue-50/50 p-3 rounded-lg border border-blue-100">
                  {selectedProtocol.indications}
                </p>
              </div>

              {/* Notas */}
              {selectedProtocol.notes && (
                <div>
                  <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <Info size={16} /> Consideraciones / Preparación
                  </h3>
                  <p className="text-gray-700 text-sm bg-yellow-50 p-3 rounded-lg border border-yellow-100">
                    {selectedProtocol.notes}
                  </p>
                </div>
              )}

              {/* Secuencias */}
              <div>
                <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">
                  Secuencias del Protocolo
                </h3>
                <ul className="space-y-2">
                  {selectedProtocol.sequences.map((seq, idx) => {
                    // Resaltar el plano (Axial, Coronal, etc) si existe en el texto
                    const parts = seq.split(':');
                    return (
                      <li key={idx} className="bg-gray-50 border border-gray-100 p-3 rounded-lg flex items-start gap-3">
                        <div className="mt-1 w-2 h-2 rounded-full bg-blue-500 shrink-0"></div>
                        <div className="text-gray-800">
                          {parts.length > 1 ? (
                            <>
                              <span className="font-bold text-blue-900">{parts[0]}:</span> 
                              {parts.slice(1).join(':')}
                            </>
                          ) : (
                            seq
                          )}
                        </div>
                      </li>
                    );
                  })}
                </ul>
              </div>
            </div>
          </div>
        </main>
      </div>
    );
  }

  // --- VISTA PRINCIPAL (LISTA) ---
  return (
    <div className="min-h-screen bg-gray-50 flex flex-col font-sans">
      {/* Header & Buscador */}
      <header className="bg-blue-900 text-white pt-5 pb-4 px-4 shadow-md sticky top-0 z-10">
        <h1 className="text-2xl font-bold mb-4 text-center">Protocolos RM</h1>
        <div className="relative">
          <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <Search className="h-5 w-5 text-gray-400" />
          </div>
          <input
            type="text"
            className="block w-full pl-10 pr-3 py-3 border border-transparent rounded-xl leading-5 bg-white text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 sm:text-sm shadow-inner transition-shadow"
            placeholder="Buscar protocolo o diagnóstico..."
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
          />
        </div>
      </header>

      {/* Pestañas de Categoría */}
      <div className="bg-white border-b border-gray-200 overflow-x-auto hide-scrollbar sticky top-[108px] z-10 shadow-sm">
        <div className="flex p-2 gap-2 min-w-max">
          {['Todos', 'Neuro', 'MSK', 'Cuerpo'].map(tab => (
            <button
              key={tab}
              onClick={() => setActiveTab(tab)}
              className={`px-5 py-2 rounded-full text-sm font-semibold transition-colors flex items-center gap-2 ${
                activeTab === tab 
                  ? 'bg-blue-900 text-white shadow-md' 
                  : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
              }`}
            >
              {tab !== 'Todos' && getCategoryIcon(tab)}
              {tab}
            </button>
          ))}
        </div>
      </div>

      {/* Lista de Protocolos */}
      <main className="flex-1 p-4 overflow-y-auto pb-6">
        <div className="space-y-3">
          {filteredProtocols.length > 0 ? (
            filteredProtocols.map(protocol => (
              <div 
                key={protocol.id} 
                onClick={() => setSelectedProtocol(protocol)}
                className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 active:scale-[0.98] active:bg-gray-50 transition-all cursor-pointer flex flex-col gap-2"
              >
                <div className="flex justify-between items-start mb-1">
                  <h3 className="font-bold text-gray-800 text-lg leading-tight pr-2">{protocol.title}</h3>
                  <span className={`shrink-0 inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold border ${getCategoryColor(protocol.category)}`}>
                    {protocol.category}
                  </span>
                </div>
                <p className="text-sm text-gray-500 line-clamp-2 leading-snug">
                  {protocol.indications}
                </p>
              </div>
            ))
          ) : (
            <div className="text-center py-12 text-gray-500">
              <Search className="h-12 w-12 mx-auto text-gray-300 mb-3" />
              <p className="text-lg font-medium text-gray-600">No se encontraron protocolos</p>
              <p className="text-sm mt-1">Intenta con otros términos de búsqueda.</p>
            </div>
          )}
        </div>
      </main>
      
      {/* Estilos globales para ocultar scrollbar en pestañas */}
      <style dangerouslySetInnerHTML={{__html: `
        .hide-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .hide-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
      `}} />
    </div>
  );
}

// Conectamos React con el HTML
const root = ReactDOM.createRoot(document.getElementById('root'));
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker registrado', reg))
      .catch(err => console.error('Error al registrar Service Worker', err));
  });
}
        root.render(<ProtocolosApp />);
</script>
